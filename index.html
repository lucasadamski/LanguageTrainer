<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>Language Trainer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous">
</head>
<body>
    <div class="container text-center fs-5">

        <div id="mainMenuScreen" class="screen">
            <div class="mb-3">
                <label for="fileInput" class="form-label">Upload TXT file</label>
                <input type="file" id="fileInput" accept=".txt">
            </div>
            <button id="buttonUploadFile" class="btn btn-primary mb-3" onclick="onClickUploadFile()">Upload File</button>
        </div>
        
        <div id="settingsScreen" class="screen hidden">
            <div id="fileOutput">FileOutput</div>
            <button id="selectAllButton" class="btn btn-primary mb-3">Select All</button>
            <button id="deselectAllButton" class="btn btn-primary mb-3">Deselect All</button>            
            <button id="startNewGameButton" class="btn btn-primary w-100"> Start New Game </button>    
        </div>

        <div id="gamePlayerScreen" class="screen hidden">
            <div id="statsOutput">Statistics</div>
            <div id="questionOutput">Question Output</div>
            <div id="inputAnswer">
                <input type="text" id="answerData" class="form-control"></input>
                <button id="answerButton" class="btn btn-primary w-100">Check</button> 
            </div>
            <div id="responseOutput">ResponseOutput</div>
            <div id="videoOutput"></div>
            <button id="endGameButton" class="btn btn-primary w-100">End Game</button>
        </div>

        <div id="gameOverScreen" class="screen hidden">
            <div id="gameOverStats"></div>
            <button id="newGameButton">New Game</button>
            <button id="restartGameButton">Restart Game</button>
        </div>

    </div>
 
    
    <script type="module" src="src/features/index.js"></script>
</body>
</html>
